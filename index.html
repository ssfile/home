    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(amount || 0);
    }

    function calculateDiscountedPrice(originalPrice, discountPercent) {
      const safeDiscount = Math.min(Math.max(Number(discountPercent) || 0, 0), 99);
      const discounted = Number(originalPrice) * (1 - safeDiscount / 100);
      return Math.round(discounted / 100) * 100;
    }

    function calculatePromoCodeDiscount(priceAfterMain, promo) {
      if (!promo || !promo.active || promo.discountValue <= 0) {
        return { promoDiscountAmount: 0, finalPriceAfterPromo: priceAfterMain };
      }
      let cut = 0;
      if (promo.discountType === 'percent') {
        const safePct = Math.min(Math.max(promo.discountValue, 0), 99);
        cut = Math.round((priceAfterMain * safePct) / 100 / 100) * 100;
      } else {
        cut = Math.min(promo.discountValue, Math.max(priceAfterMain - 1000, 0));
      }
      return {
        promoDiscountAmount: cut,
        finalPriceAfterPromo: Math.max(priceAfterMain - cut, 0)
      };
    }

    function buildWhatsAppCheckoutUrl(product, appliedPromo) {
      const priceAfterMain = calculateDiscountedPrice(product.originalPrice, product.discountPercent);
      const { promoDiscountAmount, finalPriceAfterPromo } = calculatePromoCodeDiscount(
        priceAfterMain,
        appliedPromo
      );
      const productUrl = `${state.settings.domainUrl.replace(/\/$/, '')}/?produk=${product.slug}`;
      const cleanPhone = state.settings.whatsappNumber.replace(/[^0-9]/g, '');

      let message = state.settings.whatsappTemplate
        .replace('{nama_produk}', product.title)
        .replace('{harga}', formatRupiah(finalPriceAfterPromo))
        .replace('{link_produk}', productUrl);

      if (appliedPromo && promoDiscountAmount > 0) {
        message += `\n• Kode Diskon: ${appliedPromo.code} (-${formatRupiah(promoDiscountAmount)})`;
      }

      return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
    }

    function getPrioritizedRelatedProducts(currentProduct, limit = 4) {
      const candidates = state.products.filter((p) => p.id !== currentProduct.id);
      const currentTags = new Set((currentProduct.tags || []).map((t) => t.toLowerCase()));

      const scored = candidates.map((item) => {
        const sharedTags = (item.tags || []).filter((t) => currentTags.has(t.toLowerCase()));
        const sameType = item.categoryLevel3 === currentProduct.categoryLevel3;
        const sameSubCat = item.categoryLevel2 === currentProduct.categoryLevel2;
        const sameMainCat = item.categoryLevel1 === currentProduct.categoryLevel1;

        let priorityScore = 0;
        let matchLabel = 'Rekomendasi Pilihan';

        if (sharedTags.length > 0) {
          priorityScore = 400 + sharedTags.length * 10;
          matchLabel = `Terkait Tag #${sharedTags[0]}`;
        } else if (sameType) {
          priorityScore = 300;
          matchLabel = `Tipe: ${item.categoryLevel3}`;
        } else if (sameSubCat) {
          priorityScore = 200;
          matchLabel = `Sub: ${item.categoryLevel2}`;
        } else if (sameMainCat) {
          priorityScore = 100;
          matchLabel = `Kategori: ${item.categoryLevel1}`;
        }

        return { product: item, priorityScore, matchLabel };
      });

      scored.sort((a, b) => {
        if (b.priorityScore !== a.priorityScore) return b.priorityScore - a.priorityScore;
        return b.product.soldCount - a.product.soldCount;
      });

      return scored.slice(0, limit);
    }

    function getCategoryLucideName(categoryLevel1) {
      switch (categoryLevel1) {
        case 'Microsoft Word':
          return 'file-text';
        case 'Microsoft Excel':
          return 'file-spreadsheet';
        case 'PowerPoint':
          return 'presentation';
        case 'Canva':
          return 'palette';
        case 'PDF':
          return 'file-check-2';
        default:
          return 'folder-kanban';
      }
    }

    function compressImageFileToDataUrl(file, maxWidth = 960, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          if (typeof result !== 'string') {
            reject(new Error('Gagal membaca gambar'));
            return;
          }
          const img = new Image();
          img.onload = () => {
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const targetWidth = Math.round(img.width * scale);
            const targetHeight = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              resolve(result);
              return;
            }
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
            const outputMime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            resolve(canvas.toDataURL(outputMime, quality));
          };
          img.onerror = () => resolve(result);
          img.src = result;
        };
        reader.onerror = () => reject(new Error('Gagal memproses file'));
        reader.readAsDataURL(file);
      });
    }

    function getFilteredCatalogProducts() {
      return state.products.filter((item) => {
        if (state.filterLevel1 !== 'ALL' && item.categoryLevel1 !== state.filterLevel1) return false;
        if (state.filterLevel2 !== 'ALL' && item.categoryLevel2 !== state.filterLevel2) return false;
        if (state.filterLevel3 !== 'ALL' && item.categoryLevel3 !== state.filterLevel3) return false;

        if (state.activeTagFilter) {
          const hasTag = (item.tags || []).some(
            (t) => t.toLowerCase() === state.activeTagFilter.toLowerCase()
          );
          if (!hasTag) return false;
        }

        if (state.searchQuery.trim()) {
          const q = state.searchQuery.toLowerCase();
          const matchTitle = item.title.toLowerCase().includes(q);
          const matchDesc = item.shortDescription.toLowerCase().includes(q);
          const matchCat =
            item.categoryLevel1.toLowerCase().includes(q) ||
            item.categoryLevel2.toLowerCase().includes(q) ||
            item.categoryLevel3.toLowerCase().includes(q);
          const matchTag = (item.tags || []).some((t) => t.toLowerCase().includes(q));
          if (!matchTitle && !matchDesc && !matchCat && !matchTag) return false;
        }
        return true;
      });
    }

    function changeDetailSlide(dir) {

    function attachDetailTouchSwipeListeners() {
      const box = document.getElementById('detail-slide-box');
      if (!box) return;
      let startX = null;
      box.addEventListener(
        'touchstart',
        (e) => {
          startX = e.touches[0].clientX;
        },
        { passive: true }
      );
      box.addEventListener(
        'touchend',
        (e) => {
          if (startX === null) return;
          const diff = startX - e.changedTouches[0].clientX;
          if (Math.abs(diff) > 40) {
            changeDetailSlide(diff > 0 ? 1 : -1);
          }
          startX = null;
        },
        { passive: true }
      );
    }

    function applyDetailPromoCode(e) {
      e.preventDefault();
      const inputEl = document.getElementById('detail-promo-input');

      state.detailPromoInput = code;

      if (!code) {
        state.detailPromoError = 'Masukkan kode diskon terlebih dahulu.';
        renderApp();
        return;
      }

      const found = state.settings.promoCodes.find(
        (p) => p.active && p.code.trim().toUpperCase() === code
      );

      if (!found) {
        state.detailAppliedPromo = null;
        state.detailPromoError = 'Kode diskon tidak valid atau sudah tidak aktif.';
        renderApp();
        return;
      }

      state.detailAppliedPromo = found;
      state.detailPromoError = '';
      renderApp();
      showToast(`Kode diskon "${found.code}" berhasil diterapkan!`);
    }

    async function processUploadedFiles(fileList) {
      const files = Array.from(fileList || []).filter(
        (f) => f.type.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i.test(f.name)
      );
      if (!files.length) {
        showToast('Format file tidak didukung. Pilih gambar JPG, PNG, atau WebP.');
        return;
      }

      try {
        const compressedUrls = await Promise.all(
          files.map((f) => compressImageFileToDataUrl(f, 960, 0.8))
        );
        state.formProductImages.push(...compressedUrls);
        const grid = document.getElementById('product-images-preview-grid');
        if (grid) {
          grid.innerHTML = renderModalImageThumbnailsHtml();
          if (window.lucide) window.lucide.createIcons();
        }
        showToast(`${compressedUrls.length} foto produk berhasil diunggah!`);
      } catch (err) {
        showToast('Gagal memproses gambar. Silakan coba lagi.');
      }
    }

    async function handleProductImageFileSelect(e) {
      const files = e.target.files;
      if (files && files.length > 0) {
        await processUploadedFiles(files);
      }
      e.target.value = '';
    }

    async function handleImageDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('border-blue-500', 'bg-blue-50/60');
      if (e.dataTransfer?.files?.length) {

    function saveProductForm(e) {
      e.preventDefault();
      const title = document.getElementById('prod-title')?.value.trim() || '';
      if (!title) return;

      const cat1 = document.getElementById('prod-cat1')?.value || 'Microsoft Excel';
      const cat2 = document.getElementById('prod-cat2')?.value.trim() || 'Umum';
      const cat3 = document.getElementById('prod-cat3')?.value.trim() || 'Template';
      const price = Number(document.getElementById('prod-price')?.value || 150000);
      const discount = Number(document.getElementById('prod-discount')?.value || 0);
      const sold = Number(document.getElementById('prod-sold')?.value || 0);
      const featured = Boolean(document.getElementById('prod-featured')?.checked);
      const format = document.getElementById('prod-format')?.value.trim() || '.XLSX';
      const shortDesc = document.getElementById('prod-short-desc')?.value.trim() || title;
      const fullDesc = document.getElementById('prod-full-desc')?.value.trim() || shortDesc;
      const tagsRaw = document.getElementById('prod-tags')?.value || '';

      const tags = tagsRaw
        .split(',')
        .map((t) => t.trim().toLowerCase().replace(/^#/, ''))
        .filter(Boolean);

      const slug = title
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');

      if (state.editingProductId) {
        state.products = state.products.map((item) =>
          item.id === state.editingProductId
            ? {
                ...item,
                title,
                slug,
                categoryLevel1: cat1,
                categoryLevel2: cat2,
                categoryLevel3: cat3,
                originalPrice: price,
                discountPercent: discount,
                soldCount: sold,
                featured,
                fileFormat: format,
                shortDescription: shortDesc,
                fullDescription: fullDesc,
                tags: tags.length ? tags : ['ss-file'],
                images: [...state.formProductImages],
                updatedAt: new Date().toISOString().slice(0, 10)
              }
            : item
        );
        showToast('Produk dan foto berhasil diperbarui!');
      } else {
        state.products.unshift({
          id: `prod-${Date.now()}`,
          slug: `${slug}-${Date.now().toString().slice(-4)}`,
          title,
          categoryLevel1: cat1,
          categoryLevel2: cat2,
          categoryLevel3: cat3,
          originalPrice: price,
          discountPercent: discount,
          fileFormat: format,
          soldCount: sold,
          featured,
          shortDescription: shortDesc,
          fullDescription: fullDesc,
          features: [
            '100% Mudah Diedit & Disesuaikan',
            'Struktur Profesional Siap Pakai',
            'Akses Selamanya Tanpa Biaya Bulanan',
            'Panduan Penggunaan Lengkap'
          ],
          tags: tags.length ? tags : ['ss-file'],
          images: [...state.formProductImages],
          updatedAt: new Date().toISOString().slice(0, 10),
          slides: [
            {
              id: `slide-${Date.now()}`,
              title,
              subtitle: shortDesc,
              badge: 'Preview Utama',
              accentColor: 'blue',
              highlights: ['Siap Pakai & Editable', 'Format Standar Profesional', 'Akses Instan']
            }
          ]
        });
        showToast('Produk baru berhasil ditambahkan!');
      }

      persistState();
      closeProductModal();
    }

        productTitle: product || 'Paket Template SS File',
        amount,
        method: 'QRIS / Transfer Bank',
        date: 'Baru saja',
        status: 'Terkirim Instan'
      });
      persistState();
      renderApp();
      showToast('Item galeri transaksi ditambahkan!');
    }

    function deleteGalleryItem(id) {
      state.gallery = state.gallery.filter((g) => g.id !== id);
      persistState();
      renderApp();
      showToast('Item galeri dihapus.');
    }

    function saveBannerSettings() {
      state.banner = {
        active: Boolean(document.getElementById('banner-active')?.checked),
        badge: document.getElementById('banner-badge')?.value || '',
        title: document.getElementById('banner-title')?.value || '',
        subtitle: document.getElementById('banner-subtitle')?.value || '',
        ctaText: document.getElementById('banner-cta')?.value || '',
        highlightCode: document.getElementById('banner-code')?.value || ''
      };
      persistState();
      showToast('Pengaturan banner promosi disimpan!');
    }

    function addFaqItem() {
      const cat = document.getElementById('faq-cat')?.value.trim() || 'Umum';
      const question = document.getElementById('faq-question')?.value.trim();
      const answer = document.getElementById('faq-answer')?.value.trim();
      if (!question || !answer) return;

      state.faqs.push({
        id: `faq-${Date.now()}`,
        category: cat,
        question,
        answer
      });
      persistState();
      renderApp();
      showToast('FAQ baru ditambahkan!');
    }

    function deleteFaqItem(id) {
      state.faqs = state.faqs.filter((f) => f.id !== id);
      persistState();
      renderApp();
      showToast('FAQ dihapus.');
    }

    function saveAboutProfile() {
      state.about = {
        ...state.about,
        name: document.getElementById('about-name')?.value || state.about.name,
        role: document.getElementById('about-role')?.value || state.about.role,
        headline: document.getElementById('about-headline')?.value || state.about.headline,
        bio: document.getElementById('about-bio')?.value || state.about.bio,
        experienceYears: document.getElementById('about-exp')?.value || state.about.experienceYears,
        totalTemplates: document.getElementById('about-total')?.value || state.about.totalTemplates,
        happyCustomers: document.getElementById('about-clients')?.value || state.about.happyCustomers
      };
      persistState();
      showToast('Profil About Me berhasil diperbarui!');
    }

    // Settings Sub-Tabs Helpers (Payments, Colors, Texts, Promo Codes)
    function addPaymentMethod() {
      const input = document.getElementById('new-payment-method-input');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      state.settings.paymentMethods.push(val);
      persistState();
      renderApp();
      showToast('Metode pembayaran ditambahkan!');
    }

    function removePaymentMethod(idx) {
      state.settings.paymentMethods.splice(idx, 1);
      persistState();
      renderApp();
    }

    function updateThemeColor(key, val) {
      state.settings.themeColors[key] = val;
      persistState();
      renderApp();
    }

    function resetThemeColors() {
      state.settings.themeColors = { ...DEFAULT_THEME_COLORS };
      persistState();
      renderApp();
      showToast('Warna website dikembalikan ke tema default SS File!');
    }

    function applyThemePreset(presetName) {
      if (presetName === 'indigo') {
        state.settings.themeColors = {
          ...DEFAULT_THEME_COLORS,
          primaryColor: '#4f46e5',
          linkColor: '#4f46e5',
          buttonBg: '#4f46e5',
          footerBg: '#0f172a'
        };
      } else if (presetName === 'emerald') {
        state.settings.themeColors = {
          ...DEFAULT_THEME_COLORS,
          primaryColor: '#059669',
          linkColor: '#059669',
          buttonBg: '#059669',
          footerBg: '#064e3b'
        };
      } else if (presetName === 'darkHeader') {
        state.settings.themeColors = {
          ...DEFAULT_THEME_COLORS,
          headerBg: '#0f172a',
          headerText: '#ffffff',
          primaryColor: '#2563eb',
          buttonBg: '#2563eb'
        };
      } else {
        state.settings.themeColors = { ...DEFAULT_THEME_COLORS };
      }
      persistState();
      renderApp();
      showToast('Preset warna tema berhasil diterapkan!');
    }

    function resetWebsiteTexts() {
      state.settings.texts = { ...DEFAULT_TEXTS };
      persistState();
      renderApp();
      showToast('Seluruh teks website dikembalikan ke bawaan!');
    }

    function addNewPromoCode(e) {
      e.preventDefault();
      const code = document.getElementById('promo-new-code')?.value.trim().toUpperCase();
      const type = document.getElementById('promo-new-type')?.value || 'nominal';
      const val = Number(document.getElementById('promo-new-value')?.value || 0);
      if (!code || val <= 0) return;

      state.settings.promoCodes.push({
        id: `promo-${Date.now()}`,
        code,
        discountType: type,
        discountValue: val,
        active: true
      });
      persistState();
      renderApp();
      showToast(`Kode diskon "${code}" berhasil ditambahkan!`);
    }

    function updatePromoCodeValue(promoId, val) {
      const num = Number(val);
      state.settings.promoCodes = state.settings.promoCodes.map((p) =>
        p.id === promoId ? { ...p, discountValue: num } : p
      );
      persistState();
    }

    function updatePromoCodeType(promoId, type) {
      state.settings.promoCodes = state.settings.promoCodes.map((p) =>
        p.id === promoId ? { ...p, discountType: type } : p
      );
      persistState();
    }

    function togglePromoCodeActive(promoId) {
      state.settings.promoCodes = state.settings.promoCodes.map((p) =>
        p.id === promoId ? { ...p, active: !p.active } : p
      );
      persistState();
      renderApp();
    }

    function deletePromoCode(promoId) {
      state.settings.promoCodes = state.settings.promoCodes.filter((p) => p.id !== promoId);
      persistState();
      renderApp();
      showToast('Kode diskon dihapus.');
    }

    function saveFirebaseSdkConfig() {
      ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].forEach(
        (key) => {
          const el = document.getElementById(`fb-${key}`);
          if (el) state.firebaseConfig[key] = el.value.trim();
        }
      );
      state.firebaseConfig.connected = true;
      persistState();
      renderApp();
      showToast('Konfigurasi Firebase SDK berhasil disimpan & siap digunakan!');
    }

    // =========================================================================
    // 10. INITIALIZE APPLICATION ON PAGE LOAD
    // =========================================================================

    window.addEventListener('DOMContentLoaded', () => {
      applyThemeAndSeo();

      // Support direct product query link (?produk=slug)
      const params = new URLSearchParams(window.location.search);
      const slugParam = params.get('produk');
      if (slugParam) {
        const matched = state.products.find((p) => p.slug === slugParam);
        if (matched) {
          state.selectedProductId = matched.id;
          state.activeView = 'detail';
        }
      }

      renderApp();
    });
  </script>
</body>
</html>
