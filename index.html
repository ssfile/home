    // ==========================================================================
    // 3. UTILITAS FORMAT, VALIDASI WHATSAPP & DIRECT WHATSAPP ORDER
    // ==========================================================================
    function formatRupiah(amount) {
      const num = Number(amount) || 0;
      if (num === 0) return 'Gratis';
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(num);
    }

    function sanitizeWhatsAppNumber(raw) {
      if (!raw) return '';
      let digits = String(raw).replace(/\D/g, '');
      if (digits.startsWith('0')) {
        digits = '62' + digits.slice(1);
      }
      return digits;
    }

    function isValidWhatsAppNumber(number) {
      if (!number) return false;
      return /^[1-9][0-9]{8,15}$/.test(number);
    }

    function slugify(text) {
      return String(text || '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    function formatFileSize(bytes) {
      if (!bytes || isNaN(bytes)) return '-';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    /**
     * Membangun tautan resmi https://wa.me/... dan pesan otomatis dengan nama produk yang diklik
     */
    function buildWhatsAppOrderData(product, categoryName, settings) {
      const hasDiscount =
        Number(product?.discountPrice) > 0 && Number(product?.discountPrice) < Number(product?.price);
      const effectivePrice = hasDiscount ? product.discountPrice : product?.price || 0;

      const targetRawPhone = product?.whatsappNumber?.trim()
        ? product.whatsappNumber
        : settings?.whatsappNumber;
      const cleanPhone = sanitizeWhatsAppNumber(targetRawPhone);
      const isValid = isValidWhatsAppNumber(cleanPhone);

      const baseUrl = window.location.origin + window.location.pathname;
      const productUrl = `${baseUrl}#/produk/${product?.slug || ''}`;

      const message = `Halo Admin ${settings?.siteName || 'SS File'}, saya tertarik untuk membeli produk berikut:

Nama Produk: ${product?.name || '-'}
Kategori: ${categoryName || 'Produk Digital'}
Harga: ${formatRupiah(effectivePrice)}
Link Produk: ${productUrl}

Mohon informasi mengenai cara pemesanan dan pembayarannya. Terima kasih.`;

      const encodedMessage = encodeURIComponent(message);
      const waUrl = isValid ? `https://wa.me/${cleanPhone}?text=${encodedMessage}` : '#';
      const appUrl = isValid ? `whatsapp://send?phone=${cleanPhone}&text=${encodedMessage}` : '#';

      return {
        waUrl,
        appUrl,
        message,
        cleanPhone,
        isValid,
        effectivePrice
      };
    }

    function compressImageToDataUrl(file, maxWidth = 960, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        case 'cat-ppt':

        case 'cat-edu':

    class StoreErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || 'Terjadi kesalahan tampilan.' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#F8FAFC] flex items-center justify-center p-6">
              <div className="bg-white rounded-2xl border border-slate-200 p-8 max-w-md w-full text-center shadow-sm">
                <h2 className="text-lg font-bold text-[#343A40]">Terjadi Gangguan Sementara</h2>
                <p className="text-sm text-slate-600 mt-2">{this.state.errorMessage}</p>
                <button
                  type="button"
                  onClick={() => this.setState({ hasError: false, errorMessage: '' })}
                  className="mt-5 px-5 py-2.5 bg-blue-600 text-white text-sm font-semibold rounded-xl"
                >
                  Muat Ulang Tampilan
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

        <article className="group bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-blue-200 transition-all duration-200 flex flex-col overflow-hidden">

    function AllProductsPage({ products, categories, settings, initialCategory = 'all', initialSearch = '', initialSort = 'newest', onViewDetail, onOrderWhatsApp }) {

      const [selectedCategory, setSelectedCategory] = useState(initialCategory);
      const [priceRange, setPriceRange] = useState('all');
      const [sortBy, setSortBy] = useState(initialSort);
      const [visibleCount, setVisibleCount] = useState(8);

      useEffect(() => setSelectedCategory(initialCategory || 'all'), [initialCategory]);
      useEffect(() => setSearchTerm(initialSearch || ''), [initialSearch]);
      useEffect(() => setSortBy(initialSort || 'newest'), [initialSort]);
      useEffect(() => setVisibleCount(8), [searchTerm, selectedCategory, priceRange, sortBy]);

      const categoryMap = useMemo(() => {
        const map = {};
        categories.forEach((c) => {
          map[c.id] = c.name;
        });
        return map;
      }, [categories]);

      const filteredProducts = useMemo(() => {
        return products
          .filter((p) => p.isPublished !== false)
          .filter((p) => {
            if (selectedCategory !== 'all' && p.categoryId !== selectedCategory) return false;
            if (searchTerm.trim()) {
              const q = searchTerm.toLowerCase();
              const matchName = p.name?.toLowerCase().includes(q);
              const matchDesc = p.shortDescription?.toLowerCase().includes(q);
              const matchFormat = p.format?.toLowerCase().includes(q);
              if (!matchName && !matchDesc && !matchFormat) return false;
            }
            const effectivePrice =
              Number(p.discountPrice) > 0 && Number(p.discountPrice) < Number(p.price)
                ? Number(p.discountPrice)
                : Number(p.price);

            if (priceRange === 'under-50k' && effectivePrice >= 50000) return false;
            if (priceRange === '50k-75k' && (effectivePrice < 50000 || effectivePrice > 75000)) return false;
            if (priceRange === 'above-75k' && effectivePrice <= 75000) return false;
            return true;
          })
          .sort((a, b) => {
            const priceA = Number(a.discountPrice) > 0 && Number(a.discountPrice) < Number(a.price) ? Number(a.discountPrice) : Number(a.price);
            const priceB = Number(b.discountPrice) > 0 && Number(b.discountPrice) < Number(b.price) ? Number(b.discountPrice) : Number(b.price);
            if (sortBy === 'price-asc') return priceA - priceB;
            if (sortBy === 'price-desc') return priceB - priceA;
            if (sortBy === 'bestseller') return (b.isBestSeller ? 1 : 0) - (a.isBestSeller ? 1 : 0);
            const timeA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
            const timeB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
            return timeB - timeA;
          });
      }, [products, selectedCategory, searchTerm, priceRange, sortBy]);

    function AdminLoginPage({ settings, firebaseStatus, onLoginWithFirebase, onLoginDemoAdmin, onBackToStore }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPass, setShowPass] = useState(false);
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        if (!email.trim() || !password.trim()) {
          setErrorMsg('Masukkan email dan kata sandi admin.');
          return;
        }
        setLoading(true);
        try {
          await onLoginWithFirebase(email.trim(), password);
        } catch (err) {
          setErrorMsg(err?.message || 'Login gagal. Pastikan akun admin terdaftar di Firebase Authentication.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC] flex items-center justify-center p-4">

              <SSFileLogo siteName={settings.siteName} logoUrl={settings.logoUrl} size="sm" />

            </div>

            <div className="mb-6">
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-50 text-blue-600 text-xs font-bold mb-2">

              </span>
              <h1 className="text-2xl font-extrabold text-[#343A40]">Login Dashboard Admin</h1>

              </p>
            </div>

            {errorMsg && (
              <div className="mb-4 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700 flex items-start gap-2">

                <span>{errorMsg}</span>
              </div>

                <label className="block text-xs font-bold text-[#343A40] mb-1.5">Email Admin</label>
                <input

                  className="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-slate-200 rounded-xl text-sm"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-[#343A40] mb-1.5">Kata Sandi</label>
                <div className="relative">
                  <input
                    type={showPass ? 'text' : 'password'}

                    <textarea
                      rows={3}
                      value={prodForm.description || ''}
                      onChange={(e) => setProdForm({ ...prodForm, description: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-slate-200 rounded-xl text-sm"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold mb-1">Gambar Preview Utama</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={async (e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const url = await onUploadFile(file, 'public-images');
                          setProdForm({ ...prodForm, thumbnailUrl: url });
                          showToast('Gambar utama diperbarui.', 'success');
                        }}
                        className="text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold mb-1">Nomor WA Khusus (Opsional)</label>
                      <input
                        type="text"
                        value={prodForm.whatsappNumber || ''}
                        onChange={(e) => setProdForm({ ...prodForm, whatsappNumber: e.target.value })}
                        placeholder="Kosongkan untuk pakai WA utama"
                        className="w-full px-3.5 py-2 bg-[#F8FAFC] border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-4 text-xs">
                    <label className="flex items-center gap-2 font-semibold">
                      <input
                        type="checkbox"
                        checked={prodForm.isPublished !== false}
                        onChange={(e) => setProdForm({ ...prodForm, isPublished: e.target.checked })}
                      />
                      <span>Aktif</span>
                    </label>
                    <label className="flex items-center gap-2">
                      <input type="checkbox" checked={Boolean(prodForm.isNew)} onChange={(e) => setProdForm({ ...prodForm, isNew: e.target.checked })} />
                      <span>Terbaru</span>
                    </label>
                    <label className="flex items-center gap-2">
                      <input
                        type="checkbox"
                        checked={Boolean(prodForm.isBestSeller)}
                        onChange={(e) => setProdForm({ ...prodForm, isBestSeller: e.target.checked })}
                      />
                      <span>Terlaris</span>
                    </label>
                    <label className="flex items-center gap-2">
                      <input
                        type="checkbox"
                        checked={Boolean(prodForm.isFeatured)}
                        onChange={(e) => setProdForm({ ...prodForm, isFeatured: e.target.checked })}
                      />
                      <span>Pilihan</span>
                    </label>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onClick={() => setProductModalOpen(false)} className="px-4 py-2.5 rounded-xl bg-slate-100 text-xs font-bold">
                      Batal
                    </button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold">
                      Simpan Produk
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <ConfirmModal
            isOpen={Boolean(deleteProductTarget)}
            title="Hapus Produk?"
            message={`Hapus "${deleteProductTarget?.name}" dari katalog SS File?`}
            confirmLabel="Ya, Hapus"
            onCancel={() => setDeleteProductTarget(null)}
            onConfirm={async () => {
              if (deleteProductTarget) {
                await onDeleteProduct(deleteProductTarget.id);
                setDeleteProductTarget(null);
              }
            }}
          />

          <ConfirmModal
            isOpen={Boolean(deleteCategoryTarget)}
            title="Hapus Kategori?"
            message={`Hapus kategori "${deleteCategoryTarget?.name}"?`}
            confirmLabel="Ya, Hapus"
            onCancel={() => setDeleteCategoryTarget(null)}
            onConfirm={async () => {
              if (deleteCategoryTarget) {
                await onDeleteCategory(deleteCategoryTarget.id);
                setDeleteCategoryTarget(null);
              }
            }}
          />
        </div>
      );
    }

    // ==========================================================================
    // 8. ROOT APLIKASI SS FILE
    // ==========================================================================
    function App() {
      const [settings, setSettings] = useState(INITIAL_SETTINGS);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [analytics, setAnalytics] = useState([]);

      const [viewMode, setViewMode] = useState('storefront');
      const [storePage, setStorePage] = useState('home');
      const [selectedProductSlug, setSelectedProductSlug] = useState('');
      const [catalogFilters, setCatalogFilters] = useState({ categoryId: 'all', search: '', sortBy: 'newest' });

      const [firebaseUser, setFirebaseUser] = useState(null);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminUserEmail, setAdminUserEmail] = useState('');

      const [firebaseServices, setFirebaseServices] = useState({ app: null, auth: null, db: null, storage: null, projectId: '' });
      const [firebaseStatus, setFirebaseStatus] = useState('unconfigured');
      const [firebaseError, setFirebaseError] = useState('');

      const [toasts, setToasts] = useState([]);
      const [seoModalOpen, setSeoModalOpen] = useState(false);

      const showToast = (message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3600);
      };

      // Inisialisasi Firebase otomatis jika DEFAULT_FIREBASE_CONFIG tersedia
      useEffect(() => {
        if (DEFAULT_FIREBASE_CONFIG && DEFAULT_FIREBASE_CONFIG.apiKey && window.firebase) {
          handleTestAndConnectFirebase(DEFAULT_FIREBASE_CONFIG);
        }
      }, []);

      // Sinkronisasi Cloud Firestore
      useEffect(() => {
        const { db } = firebaseServices;
        if (!db || !firebaseUser || firebaseStatus !== 'connected') return;

        const baseCollection = (name) => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(name);

        const unsubProd = baseCollection('products').onSnapshot(
          (snap) => {
            if (!snap.empty) setProducts(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          },
          () => {}
        );

        const unsubCat = baseCollection('categories').onSnapshot(
          (snap) => {
            if (!snap.empty) setCategories(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          },
          () => {}
        );

        const unsubSet = baseCollection('settings')
          .doc('general')
          .onSnapshot(
            (docSnap) => {
              if (docSnap.exists) setSettings((prev) => ({ ...prev, ...docSnap.data() }));
            },
            () => {}
          );

        const unsubAnalytics = baseCollection('analytics').onSnapshot(
          (snap) => {
            setAnalytics(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          },
          () => {}
        );

        return () => {
          unsubProd();
          unsubCat();
          unsubSet();
          unsubAnalytics();
        };
      }, [firebaseServices, firebaseUser, firebaseStatus]);

      const activeProduct = useMemo(() => products.find((p) => p.slug === selectedProductSlug) || null, [products, selectedProductSlug]);

      useEffect(() => {
        const siteTitle = settings.siteName || 'SS File';
        if (viewMode === 'admin') {
          document.title = `Dashboard Admin — ${siteTitle}`;
        } else if (storePage === 'detail' && activeProduct) {
          document.title = `${activeProduct.name} — ${siteTitle}`;
        } else if (storePage === 'products') {
          document.title = `Katalog Semua Produk Digital — ${siteTitle}`;
        } else {
          document.title = `${siteTitle} — Toko Template & Dokumen Digital Siap Pakai`;
        }
      }, [viewMode, storePage, activeProduct, settings]);

      const handleNavigateStore = (page, options = {}) => {
        setViewMode('storefront');
        setStorePage(page);
        if (page === 'products') {
          setCatalogFilters((prev) => ({
            categoryId: options.categoryId !== undefined ? options.categoryId : prev.categoryId,
            search: options.search !== undefined ? options.search : prev.search,
            sortBy: options.sortBy !== undefined ? options.sortBy : prev.sortBy
          }));
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleViewProductDetail = (product) => {
        setSelectedProductSlug(product.slug);
        setViewMode('storefront');
        setStorePage('detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const recordAnalyticsEvent = async (eventType, product) => {
        const ev = {
          id: `ev-${Date.now()}`,
          productId: product.id,
          productName: product.name,
          categoryId: product.categoryId,
          eventType,
          createdAt: new Date().toISOString()
        };
        setAnalytics((prev) => [ev, ...prev]);

        const { db } = firebaseServices;
        if (db && firebaseUser && firebaseStatus === 'connected') {
          try {
            await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('analytics').add({
              productId: product.id,
              productName: product.name,
              categoryId: product.categoryId,
              eventType,
              createdAt: window.firebase.firestore.FieldValue.serverTimestamp()
            });
          } catch (err) {}
        }
      };

      // Handler Klik Beli via WhatsApp (Tautan native <a> langsung mengalihkan ke wa.me)
      const handleOrderViaWhatsApp = (product) => {
        const categoryName = categories.find((c) => c.id === product.categoryId)?.name || 'Produk Digital';
        const orderData = buildWhatsAppOrderData(product, categoryName, settings);
        if (!orderData.isValid) {
          showToast('Nomor WhatsApp admin belum valid.', 'error');
          return;
        }
        recordAnalyticsEvent('whatsapp_click', product);
        showToast(`Mengarahkan ke WhatsApp Admin untuk "${product.name}"...`, 'success');
      };

      const handleSaveProduct = async (productData, isEdit) => {
        setProducts((prev) => (isEdit ? prev.map((p) => (p.id === productData.id ? productData : p)) : [productData, ...prev]));
        const { db } = firebaseServices;
        if (db && firebaseUser && firebaseStatus === 'connected') {
          try {
            await db
              .collection('artifacts')
              .doc(APP_ID)
              .collection('public')
              .doc('data')
              .collection('products')
              .doc(productData.id)
              .set(productData, { merge: true });
          } catch (err) {}
        }
        showToast(isEdit ? 'Produk diperbarui.' : 'Produk ditambahkan.', 'success');
      };

      const handleDeleteProduct = async (productId) => {
        setProducts((prev) => prev.filter((p) => p.id !== productId));
        const { db } = firebaseServices;
        if (db && firebaseUser && firebaseStatus === 'connected') {
          try {
            await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('products').doc(productId).delete();
          } catch (err) {}
        }
        showToast('Produk dihapus.', 'success');
      };

      const handleSaveCategory = async (categoryData, isEdit) => {
        setCategories((prev) => (isEdit ? prev.map((c) => (c.id === categoryData.id ? categoryData : c)) : [...prev, categoryData]));
        const { db } = firebaseServices;
        if (db && firebaseUser && firebaseStatus === 'connected') {
          try {
            await db
              .collection('artifacts')
              .doc(APP_ID)
              .collection('public')
              .doc('data')
              .collection('categories')
              .doc(categoryData.id)
              .set(categoryData, { merge: true });
          } catch (err) {}
        }
        showToast(isEdit ? 'Kategori diperbarui.' : 'Kategori ditambahkan.', 'success');
      };

      const handleDeleteCategory = async (categoryId) => {
        setCategories((prev) => prev.filter((c) => c.id !== categoryId));
        const { db } = firebaseServices;
        if (db && firebaseUser && firebaseStatus === 'connected') {
          try {
            await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('categories').doc(categoryId).delete();
          } catch (err) {}
        }
        showToast('Kategori dihapus.', 'success');
      };

      const handleSaveSettings = async (newSettings) => {
        setSettings(newSettings);
        const { db } = firebaseServices;
        if (db && firebaseUser && firebaseStatus === 'connected') {
          try {
            await db
              .collection('artifacts')
              .doc(APP_ID)
              .collection('public')
              .doc('data')
              .collection('settings')
              .doc('general')
              .set(newSettings, { merge: true });
          } catch (err) {}
        }
      };

      const handleUploadAssetFile = async (file, folderType) => {
        const { storage } = firebaseServices;
        if (storage && firebaseStatus === 'connected') {
          try {
            const isPrivate = folderType === 'private-digital-files';
            const path = isPrivate
              ? `artifacts/${APP_ID}/private/files/${Date.now()}_${file.name}`
              : `artifacts/${APP_ID}/public/${folderType}/${Date.now()}_${file.name}`;
            const ref = storage.ref().child(path);
            await ref.put(file);
            if (isPrivate) return path;
            return await ref.getDownloadURL();
          } catch (err) {}
        }
        if (folderType === 'private-digital-files') return `private/files/${Date.now()}_${file.name}`;
        return await compressImageToDataUrl(file);
      };

      const handleTestAndConnectFirebase = async (configInput) => {
        setFirebaseStatus('testing');
        setFirebaseError('');
        try {
          if (!window.firebase) throw new Error('Firebase SDK belum termuat.');
          const appName = 'ssfile-live-app';
          const existing = window.firebase.apps.find((a) => a.name === appName);
          if (existing) await existing.delete();

          const app = window.firebase.initializeApp(
            {
              apiKey: configInput.apiKey.trim(),
              authDomain: configInput.authDomain.trim(),
              projectId: configInput.projectId.trim(),
              storageBucket: configInput.storageBucket.trim(),
              messagingSenderId: configInput.messagingSenderId.trim(),
              appId: configInput.appId.trim(),
              ...(configInput.measurementId?.trim() ? { measurementId: configInput.measurementId.trim() } : {})
            },
            appName
          );

          const auth = app.auth();
          const db = app.firestore();
          const storage = app.storage();

          const cred = await auth.signInAnonymously();
          await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('settings').doc('general').get();

          setFirebaseUser(cred.user);
          setFirebaseServices({ app, auth, db, storage, projectId: configInput.projectId.trim() });
          setFirebaseStatus('connected');
          showToast('Berhasil terhubung ke proyek Firebase!', 'success');
        } catch (err) {
          setFirebaseStatus('error');
          setFirebaseError(err?.message || 'Gagal terhubung ke Firebase.');
          showToast('Koneksi Firebase gagal.', 'error');
        }
      };

      const handleSeedInitialDataToFirestore = async () => {
        const { db } = firebaseServices;
        if (!db || firebaseStatus !== 'connected') return;
        try {
          const base = db.collection('artifacts').doc(APP_ID).collection('public').doc('data');
          await base.collection('settings').doc('general').set(settings, { merge: true });
          for (const cat of categories) {
            await base.collection('categories').doc(cat.id).set(cat, { merge: true });
          }
          for (const prod of products) {
            await base.collection('products').doc(prod.id).set(prod, { merge: true });
          }
          showToast('Seluruh katalog berhasil disinkronkan ke Firestore!', 'success');
        } catch (err) {
          showToast('Gagal menyinkronkan ke Firestore.', 'error');
        }
      };

      const handleAdminFirebaseLogin = async (email, password) => {
        const { auth } = firebaseServices;
        if (!auth) {
          throw new Error('Firebase Authentication belum dikonfigurasi. Gunakan tombol "Masuk Panel Setup & Pengelola".');
        }
        const cred = await auth.signInWithEmailAndPassword(email, password);
        setFirebaseUser(cred.user);
        setIsAdminAuthenticated(true);
        setAdminUserEmail(cred.user.email || email);
        showToast('Login admin berhasil.', 'success');
      };

      const relatedProducts = useMemo(() => {
        if (!activeProduct) return [];
        return products.filter((p) => p.isPublished !== false && p.id !== activeProduct.id && p.categoryId === activeProduct.categoryId);
      }, [products, activeProduct]);

      return (
        <StoreErrorBoundary>
          <div className="min-h-screen bg-[#F8FAFC] text-[#343A40]">
            {/* Toast Notifications */}
            <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0">
              {toasts.map((t) => (
                <div
                  key={t.id}
                  className={`pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-xs sm:text-sm font-semibold flex items-center gap-2.5 bg-white ${
                    t.type === 'error' ? 'border-rose-200 text-rose-700' : t.type === 'success' ? 'border-emerald-200 text-emerald-800' : 'border-blue-200 text-[#343A40]'
                  }`}
                >
                  <Icon name={t.type === 'error' ? 'alert' : t.type === 'success' ? 'check-circle' : 'info'} className="w-4 h-4 shrink-0" />
                  <span>{t.message}</span>
                </div>
              ))}
            </div>

            {viewMode === 'admin' ? (
              isAdminAuthenticated ? (
                <AdminDashboardShell
                  settings={settings}
                  products={products}
                  categories={categories}
                  analytics={analytics}
                  firebaseStatus={firebaseStatus}
                  firebaseError={firebaseError}
                  activeProjectId={firebaseServices.projectId}
                  adminUserEmail={adminUserEmail}
                  onSaveProduct={handleSaveProduct}
                  onDeleteProduct={handleDeleteProduct}
                  onSaveCategory={handleSaveCategory}
                  onDeleteCategory={handleDeleteCategory}
                  onSaveSettings={handleSaveSettings}
                  onUploadFile={handleUploadAssetFile}
                  onTestAndConnectFirebase={handleTestAndConnectFirebase}
                  onSeedInitialDataToFirestore={handleSeedInitialDataToFirestore}
                  onLogout={() => {
                    setIsAdminAuthenticated(false);
                    setAdminUserEmail('');
                    setViewMode('storefront');
                  }}
                  onBackToStore={() => setViewMode('storefront')}
                  showToast={showToast}
                />
              ) : (
                <AdminLoginPage
                  settings={settings}
                  firebaseStatus={firebaseStatus}
                  onLoginWithFirebase={handleAdminFirebaseLogin}
                  onLoginDemoAdmin={() => {
                    setIsAdminAuthenticated(true);
                    setAdminUserEmail('admin@ssfile.id');
                    showToast('Berhasil masuk ke Dashboard Admin SS File.', 'success');
                  }}
                  onBackToStore={() => setViewMode('storefront')}
                />
              )
            ) : (
              <div className="min-h-screen flex flex-col">
                <StorefrontNavbar
                  settings={settings}
                  categories={categories}
                  activePage={storePage}
                  onNavigate={handleNavigateStore}
                  searchQuery={catalogFilters.search}
                  onSearchSubmit={(q) => handleNavigateStore('products', { categoryId: 'all', search: q })}
                  onOpenAdmin={() => setViewMode('admin')}
                />

                <main className="flex-1">
                  {storePage === 'home' && (
                    <HomePage
                      settings={settings}
                      categories={categories}
                      products={products}
                      onNavigate={handleNavigateStore}
                      onViewDetail={handleViewProductDetail}
                      onOrderWhatsApp={handleOrderViaWhatsApp}
                    />
                  )}

                  {storePage === 'products' && (
                    <AllProductsPage
                      products={products}
                      categories={categories}
                      settings={settings}
                      initialCategory={catalogFilters.categoryId}
                      initialSearch={catalogFilters.search}
                      initialSort={catalogFilters.sortBy}
                      onViewDetail={handleViewProductDetail}
                      onOrderWhatsApp={handleOrderViaWhatsApp}
                    />
                  )}

                  {storePage === 'detail' && (
                    <ProductDetailPage
                      product={activeProduct}
                      categories={categories}
                      relatedProducts={relatedProducts}
                      settings={settings}
                      onBack={() => handleNavigateStore('products', { categoryId: 'all' })}
                      onViewDetail={handleViewProductDetail}
                      onOrderWhatsApp={handleOrderViaWhatsApp}
                      onTrackProductView={(prod) => recordAnalyticsEvent('product_view', prod)}
                    />
                  )}

                  {storePage === 'about' && <AboutPage settings={settings} onNavigate={handleNavigateStore} />}
                </main>

                <StorefrontFooter
                  settings={settings}
                  categories={categories}
                  onNavigate={handleNavigateStore}
                  onOpenAdmin={() => setViewMode('admin')}
                  onOpenSeoModal={() => setSeoModalOpen(true)}
                />
              </div>
            )}

            {/* Modal Info SEO */}
            {seoModalOpen && (
              <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setSeoModalOpen(false)}>
                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4" onClick={(e) => e.stopPropagation()}>
                  <div className="flex items-center justify-between">
                    <h3 className="text-base font-extrabold text-[#343A40]">Konfigurasi SEO &amp; GitHub Pages</h3>
                    <button type="button" onClick={() => setSeoModalOpen(false)} className="p-1.5 rounded-lg hover:bg-slate-100">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                  <p className="text-xs text-slate-600 leading-relaxed">
                    File <code className="font-mono bg-slate-100 px-1.5 py-0.5 rounded">index.html</code> ini telah dilengkapi meta description, Open Graph tags, struktur heading semantik, dan tautan langsung WhatsApp (<code className="font-mono">https://wa.me/6285705631877</code>).
                  </p>
                </div>
              </div>
            )}
          </div>
        </StoreErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
